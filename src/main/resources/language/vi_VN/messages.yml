prefix: ""

# ============================================================
# ACTION BAR COMBAT MESSAGES (edit the action_bar: value)
#   combat_countdown           – combat timer
#   combat_pearl_countdown     – combat + ngọc ender
#   combat_trident_countdown   – combat + đinh ba
#   combat_wind_countdown      – combat + wind charge
#   combat_pearl_trident_countdown – tất cả
#   pearl_only_countdown       – chỉ ngọc ender
#   trident_only_countdown     – chỉ đinh ba
#   pearl_trident_countdown    – ngọc ender + đinh ba
#   windcharge_cooldown        – wind charge
#   mace_cooldown              – chùy
#   lunge_cooldown             – lunge
#   general_item_cooldown      – vật phẩm chung
#
# Messages use MiniMessage syntax (https://docs.advntr.dev/minimessage/format.html),
# e.g. <red>, <#4A90E2>, <bold>. Placeholders use <placeholder> tags.
#
# Placeholders (action bar + combat_bossbar.title):
#   <time> <time_seconds> <time_formatted> <max_time> <combat_time>
#   <opponent> <opponent_display>
# ============================================================

# ------------------------------------------------------
#                  Combat messages
# ------------------------------------------------------
combat_countdown:
