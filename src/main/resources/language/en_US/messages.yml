prefix: ""

# ============================================================
# ACTION BAR COMBAT MESSAGES (edit the action_bar: value)
#   combat_countdown           – solo combat timer
#   combat_pearl_countdown     – combat + pearl cooldown
#   combat_trident_countdown   – combat + trident cooldown
#   combat_wind_countdown      – combat + wind charge cooldown
#   combat_pearl_trident_countdown – all three active
#   pearl_only_countdown       – pearl cooldown (no combat)
#   trident_only_countdown     – trident cooldown (no combat)
#   pearl_trident_countdown    – pearl + trident (no combat)
#   windcharge_cooldown        – wind charge cooldown bar
#   mace_cooldown              – mace cooldown bar
#   lunge_cooldown             – spear lunge cooldown bar
#   general_item_cooldown      – generic item cooldown bar
#
# Messages use MiniMessage syntax (https://docs.advntr.dev/minimessage/format.html),
# e.g. <red>, <#4A90E2>, <bold>. Placeholders use <placeholder> tags.
#
# Combat timer placeholders (action bar + combat_bossbar.title):
#   <time> <time_seconds>  – remaining seconds
#   <time_formatted>       – m:ss when >= 60s, else Ns
#   <max_time>             – full combat duration (seconds)
#   <combat_time>          – same as <time> (merged bars)
#   <opponent>             – opponent name
#   <opponent_display>     – opponent display name
# ============================================================

