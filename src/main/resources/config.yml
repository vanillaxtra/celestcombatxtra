# ============================================================
# CelestCombat Xtra — Configuration
# ============================================================
#
# TIME FORMATS
#   Simple:  20s, 5m, 1h
#   Complex: 1d_2h_30m_15s
#   Units:   s = seconds, m = minutes, h = hours,
#            d = days, w = weeks, mo = months, y = years
#
# CUSTOM LANGUAGE
#   1. Copy language/en_US/ to a new folder (e.g. language/fr_FR/)
#   2. Translate messages.yml
#   3. Set language: below to that folder name
# ============================================================

#---------------------------------------------------
#                   GENERAL
#---------------------------------------------------
# Available: en_US, vi_VN (or your custom folder name)
language: en_US

# Verbose console output for troubleshooting
debug: false

# When true, the plugin never sends action bar messages
disable_actionbar: false

#---------------------------------------------------
#                 CORE COMBAT
#---------------------------------------------------
combat:
  # How long a player stays combat-tagged after taking/dealing damage
  duration: 30s

  # blacklist = only block commands listed in blocked_commands
  # whitelist = block everything EXCEPT allowed_commands
  command_block_mode: "blacklist"

  # Used when command_block_mode is blacklist
  blocked_commands:
    - "logout"
    - "tpa"
    - "tpahere"
    - "afk"
    - "spawn"
    - "tpaccept"
    - "tpacancel"
    - "rtp"
    - "warp"
    - "home"
    - "team"
    - "enderchest"
    - "ec"
    - "vanish"
    - "v"
    - "ecall"

  # Used when command_block_mode is whitelist
  allowed_commands:
    - "msg"
    - "r"
    - "reply"
    - "tell"
    - "w"
    - "whisper"
    - "shop"
    - "buy"
    - "sell"
    - "ah"

  # If true, players kicked/banned by staff are not killed for combat logging
  exempt_admin_kick: true

  # If true, combat-log punishment drops the player's inventory at their feet
  # (needed for reliable item loss during quit; also pairs with husksync: below)
  drop_inventory: true

  # Disable Creative/Survival flight while combat-tagged
  disable_flight: false

  # Scoreboard team prefix/suffix while combat-tagged
  # Edit the text in language/<locale>/messages.yml → combat_nametag
  nametag:
    enabled: false

  # Optional boss bar showing the combat countdown
  # Edit the title in language/<locale>/messages.yml → combat_bossbar
  bossbar:
    enabled: false
    color: RED    # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
    style: SOLID  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20

  # Tag both players when explosion damage is dealt by a player
  tag_explosion_damage:
    enabled: true
    end_crystal: true
    respawn_anchor: true
    tnt_minecart: true

#---------------------------------------------------
#              ITEM RESTRICTIONS
#---------------------------------------------------
# Hard-block items in combat, and/or put materials on use cooldowns.
item_restrictions:
  enabled: false

  # Completely blocked while in combat
  # Listing ELYTRA enables elytra combat rules (see elytra: section)
  disabled_items:
    enabled: true
    items:
      - ELYTRA

  # Per-material use cooldowns (client overlay + server enforcement)
  # cooldown: duration string ("1s") or tick count (number)
  # cooldown_out_of_combat:
  #   true  = cooldown applies always (default)
  #   false = cooldown only while combat-tagged
  # Do NOT list ender pearls, tridents, wind charges, maces, or spears here —
  # those have their own dedicated sections below.
  cooldowned_items:
    enabled: true
    entries:
      - material: CHORUS_FRUIT
        cooldown: "10s"
        cooldown_out_of_combat: true

      # Bedrock/Education only (optional)
      # - material: ICE_BOMB
      #   cooldown: "1s"

#---------------------------------------------------
#            REGEARING (while combat-tagged)
#---------------------------------------------------
regearing:
  enabled: false
  block_enderchest: true
  block_shulker_boxes: true
  block_bundle_access: true

#---------------------------------------------------
#                     ELYTRA
#---------------------------------------------------
# Glide + firework rocket blocking in combat, with optional abuse penalties.
# Works on its own — you do not need to list ELYTRA under disabled_items.
elytra:
  enabled: true

  abuse_prevention:
    # If false: glide/firework stay blocked, but no strike counter and no unequip/break/drop
    enabled: true
    strikes_before_action: 2
    # When inventory is full and elytra cannot be unequipped into it:
    #   TEMP_BREAK — max durability temporarily, restore after temp_break_duration_seconds
    #   DROP       — unequip and drop at the player's feet
    full_inventory_action: TEMP_BREAK
    temp_break_duration_seconds: 10

#---------------------------------------------------
#     CRYSTAL / ANCHOR / BED / TNT MINECART
#---------------------------------------------------
# When a prevent_* option denies an action, players see an action bar notice.
explosive_controls:
  enabled: false
  end_crystal:
    prevent_placement: false
    explosion_damage_entities: true
    explosion_break_blocks: true
  respawn_anchor:
    prevent_use: false
    # When prevent_use is true, still allow anchors in the nether (vanilla behavior there)
    allow_in_nether: true
    # When false, cancel player damage from anchor blasts (even after the block is gone)
    explosion_damage_entities: true
    explosion_break_blocks: true
  bed_nether_end:
    prevent_use: false
    explosion_damage_entities: true
    explosion_break_blocks: true
  tnt_minecart:
    prevent_explosion: false
    explosion_damage_entities: true
    explosion_break_blocks: true

#---------------------------------------------------
#              ENCHANT LEVEL LIMITS
#---------------------------------------------------
# Keys are Minecraft enchantment IDs (lowercase), e.g. protection, sharpness
# violation_action: REVERT (clamp to max), DELETE (remove item), NONE (no change)
enchant_limiter:
  enabled: false
  bypass_permission: celestcombatxtra.bypass.enchant_limit
  violation_action: REVERT
  # Per-world override of the global enabled flag
  worlds:
    # world: true
    # world_nether: false
  limits:
    protection: 4
    sharpness: 5

#---------------------------------------------------
#                 ITEM LIMITER
#---------------------------------------------------
# Max amount of each material a player can hold at once.
# Materials use Bukkit names (uppercase), e.g. DIAMOND, TOTEM_OF_UNDYING
item_limiter:
  enabled: false
  bypass_permission: celestcombatxtra.bypass.item_limit
  # Per-world override of the global enabled flag
  worlds:
    # world: true
    # world_nether: false
  # When false, OP players are also limited
  op_bypasses: false
  # true = drop excess at feet; false = delete excess
  drop_excess: true
  # Grace period in ticks before scanning (~150ms at 3)
  grace_period_ticks: 3
  # Skip scanning after F-key hand swap (prevents totem drops mid-swap)
  swap_grace_ticks: 20
  # Scan interval in ticks (10 = every 0.5s). Higher = less load, slower removal
  scan_interval_ticks: 10
  # Max players scanned per tick — spreads load to avoid lag spikes
  players_per_tick: 8
  # Send excess_removed on 1st occurrence, then every N times (0 = never)
  message_interval: 100
  # Minimum ticks between deny messages per player per material (100 = 5 sec)
  deny_message_cooldown_ticks: 100
  # Set false to disable excess_removed messages entirely
  send_excess_messages: true
  limits:
    TOTEM_OF_UNDYING: 3
    GOLDEN_APPLE: 64
    # COBWEB: 64
    # ENCHANTED_GOLDEN_APPLE: 16

#---------------------------------------------------
#                 SPEAR (1.21+)
#---------------------------------------------------
spear_control:
  enabled: false
  # Only apply spear rules while combat-tagged
  in_combat_only: false
  # Blocks all spear use (lunge, right-click, jab); works even when enabled is false
  disable_spears: false
  # Cancels all spear melee and thrown spear damage; works even when enabled is false
  disable_damage: false
  lunge_cooldown:
    enabled: true
    duration: "2s"

#---------------------------------------------------
#                ENDER PEARL
#---------------------------------------------------
enderpearl:
  # Refresh combat timer when a pearl lands
  refresh_combat_on_land: false

  # Completely block pearl use during combat
  block_in_combat: false

  cooldown:
    enabled: true
    duration: 1s
    # Only apply cooldowns while combat-tagged
    in_combat_only: false
    # Per-world override of the global enabled flag
    worlds:
      minigames: false  # Example: cooldowns off in minigames world

#---------------------------------------------------
#                WIND CHARGE
#---------------------------------------------------
windcharge:
  enabled: true
  # If true, cooldown/usage controls only apply while combat-tagged
  in_combat_only: false
  # Refresh combat timer when a wind charge is thrown
  refresh_combat_on_throw: false
  cooldown:
    # Supports "10s", "5m", "1h", or a tick count number
    duration: 1s
    disable_in_combat: false
    disable_out_of_combat: false

#---------------------------------------------------
#                   TRIDENT
#---------------------------------------------------
trident:
  # Refresh combat timer when a trident lands
  refresh_combat_on_land: false

  # Block throwing and riptide entirely during combat (overrides cooldowns)
  block_in_combat: true

  # Worlds where tridents are completely banned
  banned_worlds:
    world_nether: true
    # Add more worlds as needed

  cooldown:
    enabled: true
    # Supports: s, m, h, d
    duration: "10s"
    # Only apply cooldown while combat-tagged
    in_combat_only: true
    # Per-world override of the global enabled flag
    worlds:
      world: true
      world_nether: false
      world_the_end: true

#---------------------------------------------------
#                     MACE
#---------------------------------------------------
# Mace hits start a cooldown. Do not list MACE under item_restrictions.cooldowned_items.
mace:
  enabled: true
  # any_attack = any mace hit; player_hit_only = only when hitting a player
  attack_mode: player_hit_only
  duration: 5s
  # If false, mace hits are cancelled when the attacker is not combat-tagged
  allow_out_of_combat: true

#---------------------------------------------------
#                HARMING ARROWS
#---------------------------------------------------
harming:
  no_damage: false
  # If false, cancel shooting/loading harming arrows from bows
  bows_allow_harming: true
  # If false, cancel shooting/loading harming arrows from crossbows
  crossbows_allow_harming: true
  # If false, cancel dispensers dispensing harming arrows/potions
  dispensers_allow_harming: true
  # If true, block using/dropping instant-damage potions
  prevent_potions: false

#---------------------------------------------------
#                 DEATH EFFECTS
#---------------------------------------------------
death_animation:
  enabled: true
  # Only show animations for player kills
  only_player_kill: true
  # Random selection if more than one is enabled
  animation:
    lightning: true
    fire_particles: true

#---------------------------------------------------
#                 KILL REWARDS
#---------------------------------------------------
kill_rewards:
  enabled: true

  # Commands run when a player gets a kill
  # Placeholders: %killer%, %victim%, %killer_uuid%, %victim_uuid%,
  #   %killer_health%, %victim_health%, %killer_max_health%, %victim_max_health%,
  #   %world%, %world_display%, %x%, %y%, %z% (victim location)
  commands:
    - "donutcratecore shards give %killer% 10"

  cooldown:
    # If true, any kill puts ALL kill rewards on cooldown for this player
    use_global_cooldown: false
    # Only used when use_global_cooldown is true
    duration: 1d

    # If true, cooldowns are tracked per victim (can kill different players for rewards)
    # use_global_cooldown takes priority over this
    use_same_player_cooldown: true
    # How long before rewards from the SAME victim again
    same_player_duration: 1d

#---------------------------------------------------
#             NEW PLAYER PROTECTION
#---------------------------------------------------
newbie_protection:
  enabled: true

  # How long new players stay protected
  duration: 10m

  protect_from_pvp: true
  protect_from_mobs: false

  # Remove protection when the newbie damages another player
  remove_on_damage_dealt: true

  display:
    use_bossbar: true
    use_actionbar: false
    # Edit title text in language/<locale>/messages.yml → newbie_protection_bossbar
    bossbar:
      color: "GREEN"  # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
      style: "SOLID"  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20

  # If omitted, protection is enabled in all worlds
  worlds:
    world: true
    world_nether: false
    world_the_end: false

#---------------------------------------------------
#           WORLDGUARD (safezone barrier)
#---------------------------------------------------
# Prevents combat-tagged players from entering no-PvP WorldGuard regions
safezone_protection:
  enabled: true

  # Block chorus fruit teleportation into safe zones during combat
  block_chorus_fruit: true

  # Barrier block type (BARRIER = invisible solid)
  # Materials: https://jd.papermc.io/paper/26.2/org/bukkit/Material.html
  barrier_material: "RED_STAINED_GLASS"

  # How close to the border before barriers appear
  barrier_detection_radius: 5  # blocks

  # Barrier height in blocks
  barrier_height: 3

  # Push strength when a player clips inside the barrier
  push_back_force: 0.6

  # Per-world override of the global enabled flag (unset worlds use global)
  worlds:
    spawn_world: true
    world: true
    world_nether: false
    world_the_end: false

#---------------------------------------------------
#           CLAIM SYSTEM (barrier in combat)
#---------------------------------------------------
# Prevents combat-tagged players from entering protected claims
claim_protection:
  enabled: false

  # Which claim plugin backs this: auto | griefprevention | lands
  # auto = GriefPrevention if present, otherwise Lands. Only one backend is active.
  backend: auto

  # Barrier block type (BARRIER = invisible solid)
  barrier_material: "BLUE_STAINED_GLASS"

  barrier_detection_radius: 5  # blocks
  barrier_height: 3
  push_back_force: 0.6

  # Who can bypass claim barriers while in combat (meaning depends on backend):
  # GriefPrevention: MANAGE, EDIT, BUILD (default), CONTAINER, ACCESS, NONE
  # Lands: TRUSTED (owner/trusted bypass), NONE (nobody bypasses)
  required_permission: BUILD

  # Per-world override of the global enabled flag
  worlds:
    world: true
    world_nether: true
    world_the_end: false

#---------------------------------------------------
#                   HUSKSYNC
#---------------------------------------------------
# Fixes inventory duplication when HuskSync saves a stale full inventory on
# combat-log kill and re-applies it on rejoin. Only used if HuskSync is installed.
husksync:
  enabled: true
  # Suppress the phantom "<player> died" message from applying the zeroed snapshot
  suppress_rejoin_death_message: true
